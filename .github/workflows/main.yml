name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cvera_test
          POSTGRES_PASSWORD: cvera_ci_test_only
          POSTGRES_DB: cvera_authority_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvera_test -d cvera_authority_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    outputs:
      evidence_date: ${{ steps.ci_evidence_metadata.outputs.evidence_date }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-evidence
          npm run test:ci 2>&1 | tee .ci-evidence/node-tests.txt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: apps/evt-api-go/go.sum

      - name: Run Go tests
        env:
          CVERA_AUTHORITY_TEST_DATABASE_URL: postgres://cvera_test:cvera_ci_test_only@127.0.0.1:5432/cvera_authority_test?sslmode=disable
          GOTOOLCHAIN: local
        shell: bash
        working-directory: apps/evt-api-go
        run: |
          set -o pipefail
          go test ./... -count=1 -timeout=120s 2>&1 | tee ../../.ci-evidence/go-tests.txt

      - name: Verify bounded issuance release and acceptance tooling
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 apps/evt-api-go/operations/test-evidence-issuance-smoke.py
          python3 apps/evt-api-go/operations/test-evidence-issuance-release.py

      - name: Verify API release build and targeted vulnerability fixes
        shell: bash
        run: |
          set -euo pipefail

          # Synthetic sentinel: the real production .env contains service
          # credentials and must be excluded before COPY reaches the builder.
          test ! -e apps/evt-api-go/.env
          printf 'CVERA_BUILD_CONTEXT_TEST=synthetic\n' > apps/evt-api-go/.env

          docker build \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            -t cvera-api:ci-release \
            apps/evt-api-go

          container_id="$(docker create cvera-api:ci-release)"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT

          docker cp \
            "${container_id}:/evt-api-go" \
            /tmp/evt-api-go-ci

          python3 - <<'PYIDENTITY'
          import os
          from pathlib import Path
          if os.environ["GITHUB_SHA"].encode() not in Path("/tmp/evt-api-go-ci").read_bytes():
              raise SystemExit("Docker-built API binary does not contain expected Git SHA")
          PYIDENTITY

          echo "Verified Docker-built API revision identity: ${GITHUB_SHA}"

          go version -m /tmp/evt-api-go-ci | tee .ci-evidence/go-release-build.txt
          docker cp "${container_id}:/etc/ssl/certs/ca-certificates.crt" /tmp/cvera-release-ca.pem
          sha256sum /tmp/evt-api-go-ci /tmp/cvera-release-ca.pem | tee .ci-evidence/go-release-hashes.txt
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 \
            -mode=binary -json /tmp/evt-api-go-ci > .ci-evidence/go-release-vuln.json
          python3 - <<'PYSCAN'
          import json
          from pathlib import Path
          build = Path(".ci-evidence/go-release-build.txt").read_text()
          if "go1.26.10" not in build or "GOOS=linux" not in build or "GOARCH=amd64" not in build:
              raise SystemExit("Unexpected release compiler or target")
          raw = Path(".ci-evidence/go-release-vuln.json").read_text()
          decoder = json.JSONDecoder()
          findings = set()
          binary_scan = False
          binary_sbom = False
          while raw.strip():
              value, end = decoder.raw_decode(raw.lstrip())
              raw = raw.lstrip()[end:]
              if "config" in value:
                  binary_scan = value["config"].get("scan_mode") == "binary"
              if "SBOM" in value:
                  binary_sbom = value["SBOM"].get("go_version") == "go1.26.10"
              if "finding" in value:
                  findings.add(value["finding"]["osv"])
          if not binary_scan or not binary_sbom:
              raise SystemExit("Missing or unexpected binary scan metadata")
          blocked = findings & {"GO-2026-6611", "GO-2026-6809"}
          if blocked:
              raise SystemExit("Unfixed release findings: " + ", ".join(sorted(blocked)))
          print("Targeted release fixes verified; remaining advisories require documented dispositions:", sorted(findings))
          PYSCAN

      - name: Preserve release verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: api-release-verification-${{ github.sha }}
          path: |
            .ci-evidence/go-release-build.txt
            .ci-evidence/go-release-hashes.txt
            .ci-evidence/go-release-vuln.json
          if-no-files-found: error

      - name: Create CI evidence manifest
        id: ci_evidence_metadata
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          CI_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          CI_EVIDENCE_DATE="${CI_TIMESTAMP%%T*}"

          export CI_TIMESTAMP
          export CI_EVIDENCE_DATE

          echo "CI_TIMESTAMP=$CI_TIMESTAMP" >> "$GITHUB_ENV"
          echo "CI_EVIDENCE_DATE=$CI_EVIDENCE_DATE" >> "$GITHUB_ENV"
          echo "evidence_date=$CI_EVIDENCE_DATE" >> "$GITHUB_OUTPUT"

          node - <<'NODE'
          const fs = require("fs");

          const manifest = {
            schema_version: 1,
            repository: process.env.GITHUB_REPOSITORY,
            git_sha: process.env.GITHUB_SHA,
            git_ref: process.env.GITHUB_REF,
            workflow: process.env.GITHUB_WORKFLOW,
            workflow_run_id: process.env.GITHUB_RUN_ID,
            workflow_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            tested_at: process.env.CI_TIMESTAMP,
            node: {
              command: "npm run test:ci",
              result: "passed"
            },
            go: {
              version_contract: "1.26.10",
              command: "go test ./... -count=1 -timeout=120s",
              result: "passed"
            },
            overall_result: "passed"
          };

          fs.writeFileSync(
            ".ci-evidence/manifest.json",
            JSON.stringify(manifest, null, 2) + "\n"
          );
          NODE

      - name: Archive CI evidence to DigitalOcean Spaces
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
          DO_SPACE: ${{ vars.DO_SPACE }}
          DO_REGION: ${{ vars.DO_REGION }}
          DO_ENDPOINT: ${{ vars.DO_ENDPOINT }}
          CI_EVIDENCE_DATE: ${{ env.CI_EVIDENCE_DATE }}
        run: node scripts/archive-ci-evidence.mjs

  deploy:
    name: Deploy exact validated revision
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure deployment SSH
        shell: bash
        env:
          CVERA_DEPLOY_SSH_KEY: ${{ secrets.CVERA_DEPLOY_SSH_KEY }}
          CVERA_DEPLOY_HOST: ${{ secrets.CVERA_DEPLOY_HOST }}
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh

          printf '%s\n' "${CVERA_DEPLOY_SSH_KEY}" > ~/.ssh/cvera_deploy
          chmod 600 ~/.ssh/cvera_deploy

          printf '%s %s\n' \
            "${CVERA_DEPLOY_HOST}" \
            "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFiETQzlFl4i2E3kkJ2nif5F5n7I0xagqHt7XNjHVgF7" \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Deploy exact validated revision
        shell: bash
        env:
          CVERA_DEPLOY_HOST: ${{ secrets.CVERA_DEPLOY_HOST }}
          CVERA_DEPLOY_USER: ${{ secrets.CVERA_DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/cvera_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${CVERA_DEPLOY_USER}@${CVERA_DEPLOY_HOST}" \
            "set -euo pipefail;
             cd /opt/cvera/rsa-attestation-engine;
             if [[ -n \"\$(git status --porcelain)\" ]]; then
               echo 'ERROR: repository worktree is not clean; refusing deployment' >&2;
               exit 1;
             fi;
             git fetch origin main:refs/remotes/origin/main;
             if [[ \"\$(git rev-parse origin/main)\" != '${GITHUB_SHA}' ]]; then
               echo 'ERROR: origin/main does not match validated GitHub SHA' >&2;
               exit 1;
             fi;
             git checkout --detach '${GITHUB_SHA}';
             exec scripts/deploy-api.sh '${GITHUB_SHA}'"
      - name: Create deployment evidence
        shell: bash
        env:
          CI_EVIDENCE_DATE: ${{ needs.test.outputs.evidence_date }}
        run: |
          set -euo pipefail

          if [[ -z "${CI_EVIDENCE_DATE}" ]]; then
            echo "ERROR: CI evidence date was not propagated from the authoritative test job" >&2
            exit 1
          fi

          DEPLOYMENT_ACCEPTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export DEPLOYMENT_ACCEPTED_AT

          mkdir -p .ci-evidence

          node - <<'NODE'
          const fs = require("fs");

          const deployment = {
            schema_version: 1,
            repository: process.env.GITHUB_REPOSITORY,
            git_sha: process.env.GITHUB_SHA,
            git_ref: process.env.GITHUB_REF,
            workflow: process.env.GITHUB_WORKFLOW,
            workflow_run_id: process.env.GITHUB_RUN_ID,
            workflow_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            accepted_at: process.env.DEPLOYMENT_ACCEPTED_AT,
            target: {
              service: "api",
              environment: "production"
            },
            deployment: {
              method: "exact-sha",
              result: "passed"
            },
            runtime_acceptance: {
              health: {
                endpoint: "/healthz",
                result: "passed"
              },
              revision: {
                endpoint: "/version",
                expected_git_sha: process.env.GITHUB_SHA,
                actual_git_sha: process.env.GITHUB_SHA,
                result: "passed"
              }
            },
            overall_result: "passed"
          };

          fs.writeFileSync(
            ".ci-evidence/deployment.json",
            JSON.stringify(deployment, null, 2) + "\n"
          );
          NODE
      - name: Archive deployment evidence to DigitalOcean Spaces
        env:
          DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
          DO_SPACE: ${{ vars.DO_SPACE }}
          DO_REGION: ${{ vars.DO_REGION }}
          DO_ENDPOINT: ${{ vars.DO_ENDPOINT }}
          CI_EVIDENCE_DATE: ${{ needs.test.outputs.evidence_date }}
        run: node scripts/archive-deployment-evidence.mjs
